let currentSection = 'refurbisher';
let activeStage = 0;

function showSection(id) {
  currentSection = id;
  activeStage = 0;
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderSection();
}

function renderSection() {
  const seq = sequences[currentSection];
  const content = document.getElementById('mainContent');
  if(seq.special) {
    renderSpecial(seq, content);
  } else {
    renderSequence(seq, content);
  }
}

function renderSequence(seq, content) {
  const stage = seq.stages[activeStage];
  const tlHtml = seq.timeline.map(t => `
    <div class="tl-item">
      <div class="tl-dot ${t.cls}">${t.dot}</div>
      <div class="tl-day">${t.day}</div>
      <div class="tl-action">${t.action}</div>
    </div>
  `).join('');
  const stageNavHtml = seq.stages.map((s,i) => `
    <button class="stage-btn ${i===activeStage?'active':''}" onclick="setStage(${i})">
      ${s.label.split('—')[0].replace('STAGE ','S')}
      <span class="day">${seq.timeline[i]?.day||''}</span>
    </button>
  `).join('');
  const stratHtml = stage.strategy && stage.strategy.length ? `
    <div class="strategy-box">
      <div class="strategy-box-title">💡 Why this email works</div>
      <div class="strategy-items">
        ${stage.strategy.map(s => `<div class="strategy-item"><b>${s.t}:</b> ${s.b}</div>`).join('')}
      </div>
    </div>
  ` : '';

  content.innerHTML = `
    <div class="section-header">
      <div class="section-title">${seq.emoji} ${seq.name}</div>
      <div class="section-desc">${seq.desc}</div>
    </div>
    <div class="sequence-overview">
      <div class="overview-title">6-stage sequence · Best package: <b>${seq.bestPkg}</b></div>
      <div class="timeline">${tlHtml}</div>
    </div>
    <div class="stages-nav">${stageNavHtml}</div>
    <div class="email-card">
      <div class="email-card-header">
        <div>
          <div class="email-label ${stage.labelClass}">${stage.label}</div>
          <div class="email-card-title">${stage.title}</div>
          <div class="email-card-meta">${stage.meta}</div>
        </div>
        <button class="copy-btn" onclick="copyEmail('${stage.id}')">Copy email</button>
      </div>
      <div class="email-field">
        <div class="field-label">Subject line</div>
        <div class="subject-line" id="subj-${stage.id}">${stage.subject}</div>
      </div>
      <div class="email-body" id="body-${stage.id}">${stage.body}</div>
      ${stratHtml}
    </div>
  `;
}

function renderSpecial(seq, content) {
  const cardsHtml = seq.scripts.map(s => `
    <div class="email-card">
      <div class="email-card-header">
        <div>
          <div class="email-label ${s.labelClass}">${s.label}</div>
          <div class="email-card-title">${s.title}</div>
          <div class="email-card-meta">${s.meta}</div>
        </div>
        <button class="copy-btn" onclick="copySpecial('${s.id}')">Copy</button>
      </div>
      <div class="email-field">
        <div class="field-label">Subject line</div>
        <div class="subject-line" id="subj-${s.id}">${s.subject}</div>
      </div>
      <div class="email-body" id="body-${s.id}">${s.body}</div>
    </div>
  `).join('');

  content.innerHTML = `
    <div class="section-header">
      <div class="section-title">${seq.emoji} ${seq.name}</div>
      <div class="section-desc">${seq.desc}</div>
    </div>
    <div class="special-grid">${cardsHtml}</div>
  `;
}

function setStage(i) {
  activeStage = i;
  renderSection();
}

function copyEmail(id) {
  const subj = document.getElementById('subj-'+id)?.innerText || '';
  const body = document.getElementById('body-'+id)?.innerText || '';
  const text = `Subject: ${subj}\n\n${body}`;
  navigator.clipboard.writeText(text).catch(()=>{});
  const btn = event.target;
  btn.textContent = '✓ Copied!';
  btn.classList.add('copied');
  setTimeout(()=>{btn.textContent='Copy email';btn.classList.remove('copied');},2000);
}

function copySpecial(id) {
  const subj = document.getElementById('subj-'+id)?.innerText || '';
  const body = document.getElementById('body-'+id)?.innerText || '';
  const text = `Subject: ${subj}\n\n${body}`;
  navigator.clipboard.writeText(text).catch(()=>{});
  const btn = event.target;
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},2000);
}

renderSection();
</script>
